name: Java CD Pipeline

on:
  workflow_run:
    workflows: [ "CI - Postman API Tests" ]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Backend with Maven
        working-directory: backend
        run: mvn clean package -DskipTests -B

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/phonehub-backend:latest

  deploy:
    name: Deploy to AWS EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Tạo và di chuyển vào thư mục dự án backend trên EC2
            mkdir -p /home/ubuntu/phonehub/backend
            cd /home/ubuntu/phonehub/backend

            # 2. Pull image mới nhất từ Docker Hub
            docker pull ${{ secrets.DOCKER_USERNAME }}/phonehub-backend:latest

            # 3. Khởi động lại container (Sử dụng lệnh docker compose v2 mới nhất)
            docker compose up -d

            # 4. Dọn dẹp các image cũ để giải phóng dung lượng ổ cứng
            docker image prune -f
